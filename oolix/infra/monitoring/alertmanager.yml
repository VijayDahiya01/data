# Where an alert actually goes.
#
# An alert rule with no route is a rule that fires into nothing -- a stack that
# is healthy, green and completely silent. This file used to carry
# `http://example.invalid` placeholders with a comment asking somebody to edit
# them, which is the single most forgettable kind of deployment step: every
# other setting comes from `.env.prod`, so this one got missed.
#
# The two URLs are now substituted from the environment at deploy time by
# oolix/infra/monitoring/render-alertmanager.mjs, which REFUSES to render a
# placeholder. Set ALERT_WEBHOOK_DEFAULT and ALERT_WEBHOOK_ONCALL.
route:
  # Group by Partner: one Partner's outage is one incident, however many of
  # their Agents are involved.
  group_by: ['alertname', 'partner_org']
  group_wait: 30s
  group_interval: 5m
  # Slow, on purpose. A repeat every few minutes is how a rota learns to ignore
  # the channel.
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers: [severity="page"]
      receiver: oncall
      repeat_interval: 1h

receivers:
  - name: default
    # Ticket severity. A chat webhook is usually enough.
    webhook_configs:
      - url: ${env.ALERT_WEBHOOK_DEFAULT}
        send_resolved: true

  - name: oncall
    # Page severity: whatever actually wakes someone up.
    webhook_configs:
      - url: ${env.ALERT_WEBHOOK_ONCALL}
        send_resolved: true

inhibit_rules:
  # If an Agent is unreachable, its config is stale too. Say it once.
  - source_matchers: [alertname="AgentHeartbeatStale"]
    target_matchers: [alertname=~"AgentConfig.*"]
    equal: ['agent']
