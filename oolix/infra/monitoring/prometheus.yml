# Scrape configuration for a pilot.
#
# The API is scraped over the internal network, never through the TLS
# terminator: the terminator refuses /metrics from outside on purpose, because
# the exposition names Partner organisations and Agent ids.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: oolix-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:4000']
