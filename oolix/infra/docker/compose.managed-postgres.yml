# Run against a managed PostgreSQL: RDS, DigitalOcean, Neon or any other.
#
# An overlay on compose.prod.yml. The base file runs its own Postgres and Redis
# so the stack can be proven end to end on one machine; on a real host the
# database should be a managed service, for the reason that matters most in a
# pilot: somebody else does the backups, the failover and the patching, and a
# pilot team has no capacity to do any of the three well.
#
#   docker compose -f oolix/infra/docker/compose.prod.yml \
#                  -f oolix/infra/docker/compose.managed-postgres.yml \
#                  --env-file .env.prod up -d
#
# Redis is a separate decision, made by adding compose.managed-redis.yml after
# this file. Oolix keeps nothing in Redis but the API's rate-limit windows, so
# the bundled container is a sound choice even on a real host -- it is what the
# Neon path in docs/DEPLOY-AWS.md runs. The two were one file,
# compose.managed.yml, which removed both. It was renamed rather than edited so
# that a command still naming it fails loudly instead of quietly deploying
# something else.
#
# Dependencies are restated with `!override`, not cleared with `!reset []`.
# Clearing them, as this file did until 2026-09-24, removed every edge along
# with the one to Postgres. The API and worker stopped waiting for migrations,
# so a failed migration no longer stopped a deployment -- the API came up
# serving against whatever half-migrated schema it left -- and Keycloak stopped
# waiting for its realm to be rendered. What follows is the base file's edges
# minus Postgres.
services:
  postgres: !reset null

  migrate:
    depends_on: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed instance}

  api:
    depends_on: !override
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed instance}

  worker:
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed instance}

  keycloak:
    depends_on: !override
      realm-render:
        condition: service_completed_successfully
    environment:
      # Keycloak wants a JDBC URL, which is not the same string as
      # DATABASE_URL. Giving it the postgres:// form fails at start-up with a
      # driver error that does not mention the format.
      KC_DB_URL: ${KEYCLOAK_JDBC_URL:?set KEYCLOAK_JDBC_URL, e.g. jdbc:postgresql://host:5432/keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}

  # The scheduled backup, which this overlay missed when the service was added
  # to the base file on 2026-09-09. Until 2026-09-23 the two files together were
  # an invalid project -- `backup` depended on a `postgres` service this overlay
  # removes -- so `up` on the managed path failed before anything started. That
  # is the path both deployment runbooks prescribe.
  #
  # Resetting the dependency is only half of it. The backup reaches Postgres
  # with pg_dump through libpq's own environment, and the base file points that
  # at a host called `postgres`, which does not exist on a managed deployment.
  # Left alone, every nightly run would fail -- and a backup that fails quietly
  # is found out during the restore it was meant to make possible.
  #
  # Host and port are separate variables because compose cannot take them apart
  # from DATABASE_URL. PGUSER, PGPASSWORD and the database names come from the
  # base file, which merges with this one.
  backup:
    depends_on: !reset []
    environment:
      PGHOST: ${POSTGRES_HOST:?set POSTGRES_HOST to the managed instance hostname, as in DATABASE_URL}
      PGPORT: ${POSTGRES_PORT:-5432}
      # Managed providers require TLS, and libpq's default ("prefer") would fall
      # back to plaintext if the server allowed it.
      PGSSLMODE: ${POSTGRES_SSLMODE:-require}
