# Publishes the application ports for a load baseline.
#
# An overlay, never part of a deployment. The production compose deliberately
# gives the API and portal no host ports at all: everything reaches them
# through the TLS terminator, so a misconfigured application cannot expose
# itself in plain HTTP. This file undoes that on purpose, for one purpose.
#
#   docker compose -f oolix/infra/docker/compose.prod.yml \
#                  -f oolix/infra/docker/compose.loadtest.yml \
#                  --env-file .env.prod up -d
#
# Measuring here rather than through the terminator is deliberate too: mixing
# in TLS handshakes and proxy hops measures the sum and tells you nothing about
# which part to fix. Measure the application first, then the edge, and compare.
services:
  api:
    ports:
      - '4100:4000'
  portal:
    ports:
      - '3100:3000'
