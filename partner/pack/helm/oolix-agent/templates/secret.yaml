{{- /*
The local store's password: random on first install, kept on every upgrade
(read back with lookup), never written in values. Only the store and the
Agent mount it.
*/ -}}
{{- $name := printf "%s-store-password" (include "oolix-agent.store" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "oolix-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  store-password: {{ if $existing }}{{ index $existing.data "store-password" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
