# -----------------------------------------------------------------------------
# Users and roles (§66.1)
#
# §95 asks for at least three role-bearing users per organization. The roles are
# split deliberately: PARTNER_SECURITY_ADMIN mints Agent bootstrap tokens while
# PARTNER_ADMIN handles commercial terms, and neither can do the other's job.
#
# `auth_subject` starts as `pending:<email>` and binds to the real OIDC subject
# on first login, so recreating the local Keycloak realm does not orphan a row.
# -----------------------------------------------------------------------------
users:
