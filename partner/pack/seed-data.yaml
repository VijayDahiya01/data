  - id: 33333333-3333-4333-8333-333333333333
    name: Rewards B
    type: DATA_PARTNER
    note: >-
      A second Partner. Exists so isolation is testable: no report, catalogue
      view or payout may ever let one Partner see the other (§66, §67).

  - id: 44444444-4444-4444-8444-444444444444
    name: Meridian Ventures
    type: NETWORK_SPONSOR
    note: >-
      Sponsors the private network. §31: a sponsor can curate supply but can
      NEVER override a Partner's approval decision.

  - id: 99999999-9999-4999-8999-999999999999
