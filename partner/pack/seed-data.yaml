  - id: bbbbbbbb-0001-4001-8001-000000000001
    email: partner.admin@example.test
    name: Priya Partner
    org: Travel A
    role: PARTNER_ADMIN
  - id: bbbbbbbb-0002-4002-8002-000000000002
    email: partner.security@example.test
    name: Sam Security
    org: Travel A
    role: PARTNER_SECURITY_ADMIN
  - id: bbbbbbbb-0003-4003-8003-000000000003
    email: partner.approver@example.test
    name: Arun Approver
    org: Travel A
