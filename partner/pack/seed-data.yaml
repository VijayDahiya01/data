  # One login that reaches every persona (§34: "role switching must not require
  # a second account"). Roles are held per ORGANIZATION, which is what keeps it
  # legitimate -- the same person is a Buyer admin at ABC Insurance and a
  # Partner admin at Travel A, as a real agency employee might be.
  #
  # It does NOT get around §66.2: this user still cannot approve a campaign
  # request they created themselves. Separation of duties is enforced per
  # ACTION, not per account.
  - id: ffffffff-0002-4002-8002-000000000002
    email: demo@example.test
    name: Dev Demo
    org: ABC Insurance / Travel A / Meridian Ventures / Oolix Platform Operations
    role: BUYER_ADMIN + FINANCE + ANALYST / PARTNER_ADMIN + PARTNER_SECURITY_ADMIN + PARTNER_CAMPAIGN_APPROVER + FINANCE / NETWORK_ADMIN / OOLIX_ADMIN

# -----------------------------------------------------------------------------
# Attribute taxonomy (v6 §4, Appendix A)
#
# PLATFORM data rather than a fixture: every environment needs it, including
# production, and the seeder is idempotent by (key, version).
#
# v6 inverts the Buyer flow. Instead of browsing the segments below, a Buyer
# composes rules from THIS taxonomy and Oolix finds which Partners can evaluate
# them. §17 forbids arbitrary SQL, JavaScript or regex, so what a Buyer can
# express is exactly what is defined here.
#
# Everything seeded is policy_class GENERAL. §4: "Do not enable highly sensitive
# classes in the MVP without explicit legal/policy design" -- so health,
# financial standing and the like are ABSENT rather than present and disabled.
# -----------------------------------------------------------------------------
attribute_taxonomy:
  count: 16
  categories:
    DEMOGRAPHIC: [age, gender]
    GEOGRAPHY: [country, state_region, city]
    COMMERCE: [online_shopper, purchase_category, purchase_recency_days, purchase_frequency]
    PAYMENT_BEHAVIOUR: [payment_method]
    TRAVEL: [recent_booking, domestic_international, booking_recency_days]
    ENGAGEMENT: [active_user_days, app_active, loyalty_tier]
  note: >-
    Each definition declares a data type, the operators it permits, allowed
    values and a policy class. A rule is legal only if the taxonomy says that
    attribute exists, supports that operator and permits that value.

# -----------------------------------------------------------------------------
# Segments (§38.1, §72)
#
# Oolix holds METADATA only. There is no membership list here and no exact
# count -- `reach_bucket` is what the catalogue publishes, and the exact figure
# stays inside the Partner. The local counts in the comments below exist only in
# the Partner-side fixture database.
# -----------------------------------------------------------------------------
segments:
  - id: 77777777-0001-4001-8001-000000000001
    internal_segment_id: RECENT_TRAVELLER_60D # §91 fixture segment
    display_name: Recent Travellers
    partner: Travel A
    category: travel_intent
    reach_bucket: HUNDRED_K_250K # 213,418 locally; never published
    refresh_frequency: DAILY
    allowed_channels: [PARTNER_WEB, PARTNER_APP]

  - id: 77777777-0002-4002-8002-000000000002
    internal_segment_id: PREMIUM_USER # §91 fixture segment
    display_name: Premium Members
    partner: Travel A
    category: affluence
    reach_bucket: FIFTY_K_100K # 64,207 locally; never published
    refresh_frequency: HOURLY
    allowed_channels: [PARTNER_WEB, PARTNER_APP]

  - id: 77777777-0003-4003-8003-000000000003
    internal_segment_id: TRAVEL_SHOPPER_30D
    display_name: Travel Shoppers
    partner: Travel A
    category: travel_intent
    reach_bucket: TWOFIFTY_K_500K
    refresh_frequency: SIX_HOURS
    allowed_channels: [PARTNER_WEB]

  - id: 77777777-0004-4004-8004-000000000004
    internal_segment_id: TRAVEL_REWARDS
    display_name: Travel Rewards Members
    partner: Rewards B
    category: travel_intent
    reach_bucket: HUNDRED_K_250K
    refresh_frequency: DAILY
    # META appears here so the §84 feature-flag gate is genuinely exercised.
    # Listing a channel does NOT make it usable: the flag is off by default and
    # the eligibility service must still clear it (§15, §16, §47.5).
    allowed_channels: [PARTNER_WEB, META]

