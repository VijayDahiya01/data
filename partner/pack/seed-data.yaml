# =============================================================================
# Deterministic local demo and test seed -- Appendix A, spec v5 §95.
#
# WHAT THIS FILE IS. A readable description of the fixture set that
# `pnpm db:seed` creates. The executable seed is
# `oolix/packages/db/prisma/seed/index.ts`; this file exists so a developer can see
# which identities, segments and placements they can rely on without reading
# 600 lines of TypeScript.
#
# `node scripts/verify-pack.mjs` fails if the identifiers here and the ones in
# the seed script ever disagree, so this is documentation that cannot quietly
# go stale.
#
# §95: "Seed IDs are stable in test/CI so assertions do not depend on generated
# UUIDs." Every id below is fixed, which is why the phase verifications can
# assert against them directly.
#
# NOTHING HERE IS REAL DATA. Every organization, person and email is invented,
# and every address is under `.test` (RFC 6761), which cannot resolve. §95:
# "staging -- synthetic test organizations only; never copied production
# customer data", and production seeding is refused outright.
# =============================================================================

seed:
  command: pnpm db:seed --env=<development|test|staging>
  # §95: the command must refuse. Production organizations are created only
  # through controlled onboarding and admin workflows.
  production: REFUSED

  environments:
    development: Synthetic Buyer + Partner + Network + users/roles + segments + placements + creatives + one draft campaign.
    test: Same fixtures with the same fixed IDs, so integration and E2E assertions are repeatable.
    staging: Synthetic organizations only; never copied production customer data.

# -----------------------------------------------------------------------------
# Organizations (§35)
# -----------------------------------------------------------------------------
organizations:
  - id: 11111111-1111-4111-8111-111111111111
    name: ABC Insurance
    type: BUYER
    note: The Buyer in every worked example, including the §102 settlement.

  - id: 22222222-2222-4222-8222-222222222222
    name: Travel A
    type: DATA_PARTNER
    note: >-
      The primary Data Partner. Owns the §91 fixture segments and the
      booking_success_offer placement, and is the Partner the Mock Partner app
