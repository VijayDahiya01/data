# -----------------------------------------------------------------------------
# Partner-side fixtures (§91)
#
# These live in the PARTNER's database (`partner-postgres`, port 5433 in the
# local stack), NOT in Oolix. They are the customer data the whole architecture
# exists to keep where it is -- which is exactly why they appear in a separate
# database with a separate credential.
# -----------------------------------------------------------------------------
partner_local_fixtures:
  database: postgres://partner:partner@localhost:5433/partner_audience
  known_identities:
    - partner_user_id: U123
      segments: [RECENT_TRAVELLER_60D, PREMIUM_USER]
      consent: eligible
      expected_decision: SHOW
      note: §95's canonical eligible identity.

    - partner_user_id: U456
      segments: []
      consent: eligible
      expected_decision: NO_AD
      expected_reason: NO_ELIGIBLE_CAMPAIGN
      note: §95's canonical ineligible identity -- in no segment.

    - partner_user_id: U321
      segments: [RECENT_TRAVELLER_60D]
      consent: withdrawn
      expected_decision: NO_AD
      expected_reason: CONSENT_NOT_ELIGIBLE
      note: >-
        Segment membership alone is never sufficient. §45 and §81.1 require the
        Partner's own consent check to pass, and it fails closed.

# -----------------------------------------------------------------------------
# What the seed deliberately does NOT create
# -----------------------------------------------------------------------------
never_seeded:
  - Any real person, email or organization.
  - Any table §73 forbids -- customers, audience_members, segment_members,
    partner_transactions, cross_partner_identity.
  - Any exact segment reach in Oolix (§72 publishes a bucket).
  - Any approved activation. §31 gives the Partner the final decision, and a
    seed that pre-approved one would make the approval path untested.
  - Any production data, in any environment.
