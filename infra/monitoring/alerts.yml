# =============================================================================
# Alert rules for a pilot.
#
# The thresholds are not invented here: they are the same numbers the worker
# already enforces in apps/worker/src/schedulers/index.ts. If one moves, move
# both — a rule that disagrees with the code pages at a moment the product
# considers healthy, or stays silent at one it does not.
#
# Everything here is about supply and delivery, because that is what a Partner
# and a Buyer actually feel. Nothing alerts on a per-person signal; there is no
# such signal in the control plane to alert on.
# =============================================================================
groups:
  - name: oolix-agents
    rules:
      # The one that matters most. An Agent that stops checking in stops
      # serving shortly afterwards, and the Partner sees empty ad slots while
      # Oolix sees nothing wrong at all.
      - alert: AgentHeartbeatStale
        expr: oolix_agent_heartbeat_age_seconds > 300
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Agent {{ $labels.agent }} has not checked in for {{ $value | humanizeDuration }}'
          description: >-
            Partner {{ $labels.partner_org }} is about to stop serving, if it
            has not already. Check the Agent's outbound HTTPS to the Oolix API
            first: it is the cause far more often than the Agent itself.

      # Serving from a stale config means serving decisions Oolix has already
      # superseded — including revocations.
      - alert: AgentConfigStale
        expr: oolix_agent_config_age_seconds > 300
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Agent {{ $labels.agent }} is serving a config {{ $value | humanizeDuration }} old'

      - alert: AgentConfigCritical
        expr: oolix_agent_config_age_seconds > 900
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Agent {{ $labels.agent }} config is critically stale'
          description: >-
            §24 revocation is delivered on the next check-in. At this age a
            revoked campaign may still be serving on the Partner's property.

      # Not an outage: an onboarding that stalled. Deliberately a ticket, and
      # deliberately slow, because paging someone at 3am for this is how alerts
      # get ignored.
      - alert: AgentRegisteredButNeverSeen
        expr: oolix_agents_never_seen > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: '{{ $value }} Agent(s) registered but never checked in'
          description: >-
            Usually a firewall rule that was never opened, or a bootstrap token
            that was spent against the wrong environment.

  - name: oolix-supply
    rules:
      # A commercial commitment, not a technical one — which is exactly why it
      # needs a number rather than an impression.
      - alert: PartnerReviewAgeing
        expr: oolix_partner_review_oldest_seconds > 172800
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: 'A campaign has been awaiting Partner review for over 48 hours'
          description: >-
            §101 expires a request after 7 days, and an expiry is neither an
            approval nor a rejection — the Buyer simply gets nothing. Chase it
            before it expires rather than after.

      # If nothing is live, no Buyer is getting anything, whatever the rest of
      # the dashboard says.
      - alert: NoLiveActivations
        expr: sum(oolix_activations{status="LIVE"}) == 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'No activation is live'
          description: >-
            Expected during a quiet pilot; alarming once campaigns are running.
            Raise the `for` window rather than deleting the rule.

  - name: oolix-control-plane
    rules:
      # The scrape failing is itself the first alert. Without this, every rule
      # above goes quiet at exactly the moment they should fire.
      - alert: MetricsScrapeFailing
        expr: up{job="oolix-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Cannot scrape the Oolix API'
          description: >-
            Every other alert in this file is silent while this is firing. Treat
            it as an outage until proven otherwise.
